<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>เกมตอบคำถาม BPK9</title>
<style>
  :root{
    --navy:#101534; --red:#e63946; --blue:#3a6df0; --yellow:#ffc93c; --green:#2ecc71;
    --white:#f4f6fb; --muted:#9aa3c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI',Tahoma,'Noto Sans Thai',Arial,sans-serif;
    background:radial-gradient(circle at top,#1a2260,var(--navy));
    color:var(--white);display:flex;flex-direction:column;min-height:100%;
  }
  .screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
  .screen.active{display:flex;}
  h1.logo{font-size:22px;letter-spacing:1px;margin-bottom:24px;}
  h1.logo span{color:var(--red);}
  input{width:100%;max-width:320px;padding:14px;font-size:20px;border-radius:12px;border:none;margin:8px 0;text-align:center;background:#fff;color:#111;}
  .btn{width:100%;max-width:320px;padding:14px;font-size:18px;font-weight:700;border:none;border-radius:12px;background:var(--blue);color:#fff;margin-top:14px;cursor:pointer;}
  .btn:disabled{opacity:.5;}
  .err{color:var(--red);min-height:20px;margin-top:8px;font-size:14px;}
  .muted{color:var(--muted);font-size:14px;}
  .countdown{font-size:96px;font-weight:800;}
  .qtext{font-size:20px;font-weight:600;margin-bottom:16px;max-width:600px;}
  .timerpill{background:#fff;color:#111;font-weight:800;padding:6px 16px;border-radius:20px;margin-bottom:14px;font-size:18px;}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;}
  .aopt{border:none;border-radius:16px;padding:26px 10px;font-size:22px;font-weight:800;color:#fff;cursor:pointer;min-height:90px;}
  .aopt .shape{font-size:28px;display:block;margin-bottom:4px;}
  .aopt.A{background:var(--red);} .aopt.B{background:var(--blue);}
  .aopt.C{background:var(--yellow);color:#3a2a00;} .aopt.D{background:var(--green);color:#04270f;}
  .aopt:disabled{opacity:.5;}
  .result-icon{font-size:60px;margin-bottom:8px;}
  .result-title{font-size:26px;font-weight:800;}
  .result-score{font-size:40px;font-weight:800;margin:10px 0;}
  .rankbig{font-size:56px;font-weight:800;color:var(--yellow);}
  .stat-row{display:flex;gap:20px;margin-top:16px;}
  .stat-row div{background:#1c2454;padding:10px 16px;border-radius:12px;}
</style>
</head>
<body>

<!-- ตั้งค่า 2 ค่านี้ก่อนใช้งานจริง — publicSheetId ต้องเป็น "PUBLIC SPREADSHEET"
     แยกไฟล์ต่างหาก (Anyone with the link: Viewer) ไม่ใช่ไฟล์หลัก
     ดู 00-ARCHITECTURE.md -->
<div id="config"
  data-gas-url="<<< REPLACE WITH YOUR APPS SCRIPT WEB APP URL >>>"
  data-public-sheet-id="<<< REPLACE WITH YOUR PUBLIC SPREADSHEET ID >>>"
  style="display:none"></div>

<!-- 1. หน้าใส่ PIN -->
<section id="screen-pin" class="screen active">
  <h1 class="logo">BPK9 <span>LIVE QUIZ</span></h1>
  <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="ใส่ Game PIN">
  <button class="btn" id="btnCheckPin">เข้าร่วมเกม</button>
  <div class="err" id="pinErr"></div>
</section>

<!-- 2. หน้ากรอกชื่อ -->
<section id="screen-name" class="screen">
  <h1 class="logo">BPK9 <span>LIVE QUIZ</span></h1>
  <input id="nicknameInput" maxlength="30" placeholder="ชื่อเล่นที่จะแสดงในเกม">
  <input id="realNameInput" maxlength="60" placeholder="ชื่อ-นามสกุลจริง">
  <button class="btn" id="btnJoin">เข้าร่วม</button>
  <div class="err" id="nameErr"></div>
</section>

<!-- 3. ห้องรอ -->
<section id="screen-waiting" class="screen">
  <h1 class="logo">BPK9 <span>LIVE QUIZ</span></h1>
  <p id="waitingNickname" style="font-size:20px"></p>
  <p class="muted">รอผู้จัดเริ่มเกม...</p>
  <p class="muted" id="waitingCount"></p>
  <p class="muted">● เชื่อมต่อแล้ว</p>
</section>

<!-- 4. นับถอยหลัง -->
<section id="screen-countdown" class="screen">
  <div class="countdown" id="countdownNum">3</div>
</section>

<!-- 5. คำถาม -->
<section id="screen-question" class="screen">
  <div class="timerpill" id="timerPill">20</div>
  <p class="qtext" id="questionText"></p>
  <div class="answers">
    <button class="aopt A" data-ans="A"><span class="shape">▲</span><span id="optA"></span></button>
    <button class="aopt B" data-ans="B"><span class="shape">◆</span><span id="optB"></span></button>
    <button class="aopt C" data-ans="C"><span class="shape">●</span><span id="optC"></span></button>
    <button class="aopt D" data-ans="D"><span class="shape">■</span><span id="optD"></span></button>
  </div>
</section>

<!-- 6. รอผล -->
<section id="screen-submitted" class="screen">
  <div class="result-icon">✓</div>
  <p style="font-size:20px">ส่งคำตอบแล้ว</p>
  <p class="muted">กำลังรอผลลัพธ์...</p>
</section>

<!-- 7. เฉลย -->
<section id="screen-reveal" class="screen">
  <div id="revealIcon" class="result-icon"></div>
  <div id="revealTitle" class="result-title"></div>
  <div id="revealScore" class="result-score"></div>
  <div class="stat-row">
    <div>คะแนนรวม<br><b id="revealTotal">0</b></div>
  </div>
</section>

<!-- 8. จบเกม -->
<section id="screen-final" class="screen">
  <h1 class="logo">จบเกม! 🎉</h1>
  <div class="rankbig" id="finalRank">#-</div>
  <p class="muted">อันดับของคุณ</p>
  <div class="stat-row">
    <div>คะแนนรวม<br><b id="finalScore">0</b></div>
    <div>ตอบถูก<br><b id="finalCorrect">0</b></div>
  </div>
</section>

<!-- iframe ซ่อนไว้สำหรับ form POST -->
<iframe name="hiddenPostFrame" style="display:none"></iframe>

<script>
/* ==========================================================
   BPK9 LIVE QUIZ — Player Client
   เขียน (join/answer) -> hidden-iframe form POST ไปยัง Apps Script
   อ่าน (game state/คะแนน) -> gviz CSV จาก "PUBLIC SPREADSHEET" เท่านั้น
   (ไฟล์แยกจากไฟล์หลัก ไม่มีเฉลย/อีเมลแอดมิน/ชื่อจริง — ดู 00-ARCHITECTURE.md)
   ========================================================== */

var cfg = document.getElementById('config').dataset;
var GAS_URL = cfg.gasUrl;
var PUBLIC_SHEET_ID = cfg.publicSheetId;

function gvizUrl(sheetName) {
  return 'https://docs.google.com/spreadsheets/d/' + PUBLIC_SHEET_ID +
    '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName) + '&_=' + Date.now();
}

// CSV parser (รองรับฟิลด์ที่มี comma/quote/ขึ้นบรรทัดใหม่ เช่นคำถามยาวๆ)
function parseCsv(text) {
  var rows = [];
  var row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = ''; rows.push(row); row = [];
      } else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.length > 1 || r[0] !== ''; });
}

function csvToObjects(text) {
  var rows = parseCsv(text);
  if (!rows.length) return [];
  var headers = rows[0].map(function (h) { return h.trim(); });
  return rows.slice(1).map(function (r) {
    var obj = {};
    headers.forEach(function (h, i) { obj[h] = r[i] !== undefined ? r[i] : ''; });
    return obj;
  });
}

function fetchPublicSheet(sheetName) {
  return fetch(gvizUrl(sheetName)).then(function (res) {
    if (!res.ok) throw new Error('อ่านข้อมูลไม่สำเร็จ');
    return res.text();
  }).then(csvToObjects);
}

// ส่ง form POST ผ่าน hidden iframe (ผ่านไฟร์วอลล์ที่บล็อก fetch ไป script.google.com ได้)
function postViaIframe(fields) {
  var form = document.createElement('form');
  form.method = 'POST';
  form.action = GAS_URL;
  form.target = 'hiddenPostFrame';
  form.style.display = 'none';
  Object.keys(fields).forEach(function (k) {
    var input = document.createElement('input');
    input.name = k;
    input.value = fields[k];
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(function () { form.remove(); }, 3000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function genPlayerId() {
  if (window.crypto && crypto.randomUUID) return 'P_' + crypto.randomUUID().split('-')[0];
  return 'P_' + Math.random().toString(36).slice(2, 10);
}

// ---------------- state ของ client ----------------
var gameId = null, pin = null, playerId = null, nickname = null;
var lastKnownStatus = null;
var lastKnownQuestionId = null;
var lastKnownTotalScore = 0;
var answeredThisQuestion = false;
var pollTimer = null;
var currentQuestionId = null;

// ---------------- 1) ตรวจ PIN (เทียบกับ public STATE — มี 1 แถวต่อเกมที่กำลังใช้งาน) ----------------
function checkPin(pinValue) {
  var el = document.getElementById('pinErr');
  el.textContent = '';
  pin = pinValue;
  if (!/^\d{4,6}$/.test(pin)) { el.textContent = 'PIN ไม่ถูกต้อง'; return; }
  el.textContent = 'กำลังตรวจสอบ...';

  fetchPublicSheet('STATE').then(function (rows) {
    var g = rows.find(function (r) { return String(r.pin) === pin && ['FINISHED', 'ENDED'].indexOf(r.status) === -1; });
    if (!g) { el.textContent = 'ไม่พบเกม หรือเกมนี้ปิดไปแล้ว'; return; }
    gameId = g.gameId;
    el.textContent = '';
    showScreen('screen-name');
  }).catch(function () { el.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'; });
}
document.getElementById('btnCheckPin').addEventListener('click', function () {
  checkPin(document.getElementById('pinInput').value.trim());
});

// ---------------- 2) เข้าร่วม ----------------
document.getElementById('btnJoin').addEventListener('click', function () {
  var el = document.getElementById('nameErr');
  el.textContent = '';
  nickname = document.getElementById('nicknameInput').value.trim();
  var realName = document.getElementById('realNameInput').value.trim();
  if (nickname.length < 2 || nickname.length > 30) { el.textContent = 'ชื่อเล่นต้อง 2-30 ตัวอักษร'; return; }

  playerId = genPlayerId();
  document.getElementById('btnJoin').disabled = true;
  postViaIframe({ action: 'joinGame', pin: pin, nickname: nickname, realName: realName, playerId: playerId });

  // ตรวจผลย้อนกลับ (iframe post อ่าน response ตรงไม่ได้): มองหาแถวตัวเองใน
  // public PLAYERS หลังส่งไปแล้วสักครู่ ถ้าไม่เจอ ลองซ้ำไม่กี่ครั้ง
  var attempts = 0;
  var check = function () {
    attempts++;
    fetchPublicSheet('PLAYERS').then(function (players) {
      var found = players.find(function (p) { return p.playerId === playerId && p.gameId === gameId; });
      if (found) {
        document.getElementById('waitingNickname').textContent = 'สวัสดี ' + nickname;
        showScreen('screen-waiting');
        startPolling();
      } else if (attempts < 6) {
        setTimeout(check, 1200);
      } else {
        el.textContent = 'เข้าร่วมไม่สำเร็จ (อาจเพราะชื่อซ้ำ หรือเกมปิดรับแล้ว) กรุณาลองใหม่';
        document.getElementById('btnJoin').disabled = false;
      }
    });
  };
  setTimeout(check, 1200);
});

// ---------------- 3) submit answer ----------------
document.querySelectorAll('.aopt').forEach(function (b) {
  b.addEventListener('click', function () {
    if (answeredThisQuestion) return;
    answeredThisQuestion = true;
    document.querySelectorAll('.aopt').forEach(function (x) { x.disabled = true; });
    postViaIframe({
      action: 'submitAnswer', gameId: gameId, playerId: playerId,
      questionId: currentQuestionId, selectedAnswer: b.dataset.ans
    });
    showScreen('screen-submitted');
  });
});

// ---------------- polling loop (อ่านจาก public STATE เท่านั้น) ----------------
function startPolling() {
  poll();
  pollTimer = setInterval(poll, 1500);
}

function poll() {
  fetchPublicSheet('STATE').then(function (rows) {
    var s = rows.find(function (r) { return r.gameId === gameId; });
    if (!s) return;
    handleState(s);
  }).catch(function () { /* เงียบไว้ รอบหน้าค่อยลองใหม่ */ });
}

function handleState(s) {
  var now = Date.now(); // เวลาประมาณของ client — เทียบกับ timestamp ที่ server ฝังไว้ (ดูหมายเหตุ 00-ARCHITECTURE.md)
  var startTs = Number(s.questionStartTimestamp) || 0;
  var endTs = Number(s.questionEndTimestamp) || 0;
  currentQuestionId = s.currentQuestionId;

  if (s.status === 'WAITING') {
    document.getElementById('waitingCount').textContent = 'ผู้เล่นในห้อง ' + s.playerCount + ' คน';
    if (!document.getElementById('screen-waiting').classList.contains('active') &&
        !document.getElementById('screen-name').classList.contains('active')) {
      showScreen('screen-waiting');
    }
    lastKnownStatus = s.status;
    return;
  }

  if (s.status === 'QUESTION_ACTIVE' || s.status === 'PAUSED') {
    if (lastKnownStatus !== s.status || lastKnownQuestionId !== currentQuestionId) {
      answeredThisQuestion = false;
      document.querySelectorAll('.aopt').forEach(function (x) { x.disabled = false; });
      document.getElementById('questionText').textContent = s.questionText;
      document.getElementById('optA').textContent = s.optionA;
      document.getElementById('optB').textContent = s.optionB;
      document.getElementById('optC').textContent = s.optionC;
      document.getElementById('optD').textContent = s.optionD;
      lastKnownQuestionId = currentQuestionId;
    }

    if (now < startTs) {
      var secLeft = Math.ceil((startTs - now) / 1000);
      document.getElementById('countdownNum').textContent = secLeft > 0 ? secLeft : 'GO!';
      showScreen('screen-countdown');
    } else if (!answeredThisQuestion) {
      var remain = Math.max(0, Math.ceil((endTs - now) / 1000));
      document.getElementById('timerPill').textContent = s.status === 'PAUSED' ? '⏸' : remain;
      showScreen('screen-question');
    }
    lastKnownStatus = s.status;
    return;
  }

  if (s.status === 'ANSWER_REVEAL') {
    if (lastKnownStatus !== 'ANSWER_REVEAL_' + currentQuestionId) {
      lastKnownStatus = 'ANSWER_REVEAL_' + currentQuestionId;
      showRevealResult_(s.correctAnswer);
    }
    return;
  }

  if (s.status === 'FINISHED' || s.status === 'ENDED') {
    if (lastKnownStatus !== 'FINISHED') {
      lastKnownStatus = 'FINISHED';
      showFinalResult_();
      if (pollTimer) clearInterval(pollTimer);
    }
  }
}

// เทียบ totalScore ปัจจุบัน (จาก public PLAYERS) กับที่จำไว้ก่อนหน้า เพื่อหา
// คะแนนที่ได้เพิ่มรอบนี้ — ต้องรอแอดมิน flush ก่อน จึงอาจช้ากว่า state 1-2 รอบ poll
function showRevealResult_(correctAnswer) {
  fetchPublicSheet('PLAYERS').then(function (players) {
    var me = players.find(function (p) { return p.playerId === playerId; });
    if (!me) return;
    var newTotal = Number(me.totalScore) || 0;
    var gained = newTotal - lastKnownTotalScore;
    lastKnownTotalScore = newTotal;
    var isCorrect = gained > 0;
    document.getElementById('revealIcon').textContent = isCorrect ? '✓' : '✕';
    document.getElementById('revealTitle').textContent = isCorrect ? 'ถูกต้อง!' : 'ไม่ถูกต้อง (เฉลย ' + correctAnswer + ')';
    document.getElementById('revealTitle').style.color = isCorrect ? '#2ecc71' : '#e63946';
    document.getElementById('revealScore').textContent = (isCorrect ? '+' : '') + gained + ' คะแนน';
    document.getElementById('revealTotal').textContent = newTotal;
    showScreen('screen-reveal');
  });
}

// จบเกม: จัดอันดับเองจาก public PLAYERS (เรียงคะแนนมาก->น้อย) เพราะ RESULTS
// (มี tie-break ละเอียดกว่า) อยู่ในไฟล์หลักที่ผู้เล่นอ่านไม่ได้
function showFinalResult_() {
  fetchPublicSheet('PLAYERS').then(function (players) {
    var mine = players.filter(function (p) { return p.gameId === gameId; });
    mine.sort(function (a, b) { return Number(b.totalScore) - Number(a.totalScore); });
    var myIndex = mine.findIndex(function (p) { return p.playerId === playerId; });
    var me = mine[myIndex];
    if (!me) return;
    document.getElementById('finalRank').textContent = '#' + (myIndex + 1);
    document.getElementById('finalScore').textContent = me.totalScore;
    document.getElementById('finalCorrect').textContent = me.correctCount;
    showScreen('screen-final');
  });
}

// ---------------- เริ่มต้น: รองรับ ?pin=XXXX จากลิงก์ QR code ----------------
(function init() {
  if (!GAS_URL || GAS_URL.indexOf('REPLACE') !== -1 || !PUBLIC_SHEET_ID || PUBLIC_SHEET_ID.indexOf('REPLACE') !== -1) {
    document.getElementById('pinErr').textContent = 'ยังไม่ได้ตั้งค่า data-gas-url / data-public-sheet-id';
    return;
  }
  var urlPin = new URLSearchParams(location.search).get('pin');
  if (urlPin && /^\d{4,6}$/.test(urlPin)) {
    document.getElementById('pinInput').value = urlPin;
    checkPin(urlPin);
  }
})();
</script>
</body>
</html>
